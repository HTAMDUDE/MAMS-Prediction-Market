{% extends "base.html" %}
{% block title %}Log in · MAMS Prediction Market{% endblock %}
{% block content %}
<div class="auth card">
  <h1>Log in</h1>
  <form method="post" class="stack">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label class="field"><span>Username</span><input name="username" required autofocus autocomplete="username"></label>
    <label class="field"><span>Password</span><input type="password" name="password" required autocomplete="current-password"></label>
    <button class="btn btn-block">Log in</button>
  </form>
  <p class="muted center">New here? <a href="{{ url_for('register') }}">Create an account</a></p>
</div>
{% endblock %}
