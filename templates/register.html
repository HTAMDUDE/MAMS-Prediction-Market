{% extends "base.html" %}
{% block title %}Sign up · MAMS Prediction Market{% endblock %}
{% block content %}
<div class="auth card">
  <h1>Create an account</h1>
  <p class="muted">You'll start with Ⓜ1,000 {{ CURRENCY }} — play money, no real value.</p>
  <form method="post" class="stack">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label class="field"><span>Username</span>
      <input name="username" required autofocus minlength="3" maxlength="20" pattern="[A-Za-z0-9_.\-]+" autocomplete="username"
             value="{{ request.form.username }}">
    </label>
    <label class="field"><span>Password</span><input type="password" name="password" required minlength="6" autocomplete="new-password"></label>
    <label class="field"><span>Confirm password</span><input type="password" name="confirm" required minlength="6" autocomplete="new-password"></label>
    <button class="btn btn-block">Sign up</button>
  </form>
  <p class="muted center">Already have an account? <a href="{{ url_for('login') }}">Log in</a></p>
</div>
{% endblock %}
